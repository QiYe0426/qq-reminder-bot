<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>猎宝控制台</title>
  <link rel="stylesheet" href="/hunterbot/admin-console/static/style.css?v=20260709-03" />
</head>
<body>
  <div class="shell">

    <!-- ===== 左栏：导航 + 上下文 ===== -->
    <aside class="sidebar">
      <div class="brand">
        <div class="brand-icon">
          <svg viewBox="0 0 32 32" fill="none" xmlns="http://www.w3.org/2000/svg">
            <!-- crosshair circle -->
            <circle cx="16" cy="16" r="11" stroke="currentColor" stroke-width="1.5" />
            <!-- cross lines -->
            <line x1="16" y1="2" x2="16" y2="9" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" />
            <line x1="16" y1="23" x2="16" y2="30" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" />
            <line x1="2" y1="16" x2="9" y2="16" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" />
            <line x1="23" y1="16" x2="30" y2="16" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" />
            <!-- center dot -->
            <circle cx="16" cy="16" r="2.5" fill="currentColor" />
            <!-- tick marks -->
            <line x1="11" y1="6.7" x2="12.5" y2="8.2" stroke="currentColor" stroke-width="1.2" stroke-linecap="round" />
            <line x1="21" y1="6.7" x2="19.5" y2="8.2" stroke="currentColor" stroke-width="1.2" stroke-linecap="round" />
            <line x1="11" y1="25.3" x2="12.5" y2="23.8" stroke="currentColor" stroke-width="1.2" stroke-linecap="round" />
            <line x1="21" y1="25.3" x2="19.5" y2="23.8" stroke="currentColor" stroke-width="1.2" stroke-linecap="round" />
          </svg>
        </div>
        <div class="brand-text">
          <div class="brand-title">猎宝控制台</div>
          <div class="brand-subtitle">HunterBot Admin</div>
        </div>
      </div>

      <div class="nav-area">
        <div class="nav-spacer"></div>
        <nav class="main-nav" aria-label="主导航">
          <button class="nav-item active" data-view="persona" type="button">Bot 人设</button>
          <button class="nav-item" data-view="knowledge" type="button">知识库</button>
          <button class="nav-item" data-view="groups" type="button">群管理</button>
        </nav>
        <div class="nav-spacer"></div>
        <div class="side-panel" id="sidePanel"></div>
      </div>

      <nav class="bottom-nav" aria-label="底部导航">
        <button class="nav-item" data-view="about" type="button">关于猎宝</button>
      </nav>

      <div class="version" id="version">v1.2.1</div>
    </aside>

    <!-- ===== 中栏：内容区 ===== -->
    <main class="workspace">
      <header class="topbar">
        <div>
          <h1 id="pageTitle">Bot 人设</h1>
          <p id="pageSubtitle">编辑猎宝全局回复风格和设定。</p>
        </div>
        <div class="top-actions">
          <div class="theme-switch" aria-label="颜色模式">
            <button class="theme-option" data-theme-option="light" type="button">日间</button>
            <button class="theme-option" data-theme-option="dark" type="button">夜间</button>
          </div>
          <span class="status" id="status"></span>
          <button class="button ghost" id="refreshButton" type="button">刷新</button>
          <button class="button primary" id="saveButton" type="button">保存</button>
        </div>
      </header>

      <section class="content" id="content"></section>
    </main>

    <!-- ===== 右栏：详情 / 编辑区 ===== -->
    <aside class="right-panel" id="rightPanel">
      <div class="right-content" id="rightContent"></div>
    </aside>

  </div>

  <script src="/hunterbot/admin-console/static/app.js?v=20260709-01"></script>
</body>
</html>
